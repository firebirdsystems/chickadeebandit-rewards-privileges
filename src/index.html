<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rewards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --card: var(--hub-surface, #fff);
      --border: var(--hub-border, #e5e7eb);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-light: var(--bg);
      --green: var(--hub-tint-success-fg, #16a34a);
      --green-light: var(--hub-tint-success, #dcfce7);
      --amber: var(--hub-tint-warning-fg, #d97706);
      --amber-light: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #dc2626);
      --radius: var(--hub-radius, .5rem);
      --shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5; }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; padding:14px 18px; border-radius:var(--radius); background:var(--accent); color:var(--hub-primary-fg, #fff); }
    h1 { font-size:1.2rem; }
    .sub { font-size:.8rem; opacity:.75; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border:0; border-radius:8px; font-weight:700; font-size:.86rem; cursor:pointer; }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn-primary { background:var(--accent); color:var(--hub-primary-fg, #fff); }
    .btn-ghost { background:transparent; color:var(--muted); border:1.5px solid var(--border); }
    .btn-good { background:var(--green); color:#fff; }
    .btn-danger { background:var(--red); color:#fff; }
    .btn-sm { padding:5px 10px; font-size:.78rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
    .card-body { padding:16px 18px; }
    .section-title { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:9px; }
    .points { display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--accent-light); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
    .points strong { font-size:1.8rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
    .reward { padding:14px; }
    .reward-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px; }
    .reward h3 { font-size:1rem; }
    .desc { color:var(--muted); font-size:.84rem; min-height:2.4em; }
    .bar { height:8px; border-radius:999px; background:var(--border); overflow:hidden; margin:12px 0 6px; }
    .fill { height:100%; background:var(--green); border-radius:inherit; }
    .meta { display:flex; justify-content:space-between; gap:8px; font-size:.78rem; color:var(--muted); margin-bottom:12px; }
    .request { border-top:1px solid var(--border); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .status { font-size:.74rem; font-weight:800; text-transform:uppercase; border-radius:999px; padding:2px 7px; }
    .status.pending { color:var(--amber); background:var(--amber-light); }
    .status.approved { color:var(--green); background:var(--green-light); }
    .status.rejected { color:var(--red); background:var(--hub-tint-danger, #fee2e2); }
    .empty, .loading { text-align:center; padding:36px 16px; color:var(--muted); }
    .tabs { display:flex; gap:4px; background:var(--border); border-radius:10px; padding:3px; margin-bottom:14px; }
    .tab { flex:1; padding:7px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-weight:800; cursor:pointer; }
    .tab.active { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .selector { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-bottom:14px; }
    .selector-btn { justify-content:space-between; background:var(--card); color:var(--text); border:1.5px solid var(--border); }
    .selector-btn.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-light); }
    .notice { border-left:4px solid var(--amber); }
    .app-error { border-left:4px solid var(--red); color:var(--red); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
    @media (min-width:480px) { .modal-backdrop { align-items:center; padding:20px; } }
    .modal { background:var(--card); width:100%; max-width:480px; padding:22px; border-radius:var(--radius) var(--radius) 0 0; }
    @media (min-width:480px) { .modal { border-radius:var(--radius); } }
    .modal h3 { margin-bottom:16px; }
    .form-group { margin-bottom:13px; }
    .form-group label { display:block; font-size:.78rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
    .form-group input, .form-group textarea, .form-group select { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:9px 11px; font:inherit; }
    .modal-actions { display:flex; gap:8px; margin-top:18px; }
    .modal-actions .btn { flex:1; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/rewards-privileges/" />
</head>
<body>
<div class="app"><div id="root" class="loading">Loading...</div></div>

<script type="module">
import { esc, isAdult, searchMatch, automationStatus, glyph } from "/hub-sdk.js";
import { pointsFromLedger, availablePointsFromEarned, combineRedemptions, rewardProgress, canRedeem, pendingForReward, searchableFields, reviewsRedemptions, hasNoChildren, canAffordApproval, decisionChoices, normalizeReward, stalledPointsSource } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const EVENTS = window.__EVENTS_URL ?? "/api/events";
const ACTIVITY = window.__ACTIVITY_URL ?? "";
// Demo mode is the page opened with no hub behind it. A viewer the hub knows
// but who is not a member here (VIEW_ONLY) still reads real data: they get the
// reward list and nothing to press, not a made-up adult over real members.
const LOCAL_DEMO = !DB && !window.__CURRENT_MEMBER;
const VIEW_ONLY = !!DB && !window.__CURRENT_MEMBER;
const HUB_ORIGIN = window.__HUB_ORIGIN ?? "";
// Points arrive through automations the hub runs (completed chores, a week of
// practice). When none of them can run — the source app is not installed, or
// the automation is off — every balance reads 0, so admins (the people who can
// fix it, and the only ones the hub answers) are told why instead of guessing.
let pointsSource = null;   // { state: "off" | "unavailable", title, publishers } or null
let ME = window.__CURRENT_MEMBER ?? (LOCAL_DEMO ? { id:"adult-1", name:"Alex", role:"adult" } : null);

let members = [];
let rewards = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
let redemptionRequests = [];
let redemptionDecisions = [];
let redemptions = [];
let pointsLedger = [];        // demo mode only — live mode never fetches ledger rows
let earnedByMember = new Map();  // member_id -> rollup opening + SUM(live ledger tail)
let selectedKidId = null;
let tab = "rewards";
let modalEl = null;
let errorMsg = "";      // the last refusal or failure, shown under the header
let loadFailed = false; // the first load failed: rewards and points are unknown, not empty

// Answering requests and seeing other members' points: any adult in a
// household, and only the steward in a shared space. The hub decides; this
// only keeps the page from showing balances it cannot read and buttons that
// would be refused. A function, because demo mode swaps ME.
const TENANT = { tenantKind: window.__TENANT_KIND ?? "household", isAdmin: window.__IS_ADMIN === true };
// Nobody reviews without being a member here: a session the hub knows only as
// an admin has no row of its own to answer with.
function reviews() { return !!ME && reviewsRedemptions(ME, TENANT); }

// `timeoutMs` is for reads: loads run one after another, so one that never
// answered held up every load behind it and, with them, the buttons waiting on
// those loads. A write is never cut short, since nothing would then be known
// about whether it landed.
async function db(sql, params = [], { timeoutMs = 0 } = {}) {
  if (!DB) return { rows: [] };
  const limit = timeoutMs ? new AbortController() : null;
  const timer = limit ? setTimeout(() => limit.abort(), timeoutMs) : null;
  let res;
  let json;
  try {
    res = await fetch(DB, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ sql, params }), signal: limit?.signal });
    // The limit covers the body too. Headers can arrive and the body stall,
    // and a timer cleared at the headers left this waiting for good.
    //
    // A body that cannot be read is a failure, never an empty answer. Read as
    // `{}`, a cut-off reply to the decisions read became "no decisions": every
    // approved redemption went back to pending, the points it had spent came
    // back, and approvals were judged against a balance that was not there.
    // Only a refusal (not ok) may arrive without JSON, and it is reported as
    // the refusal it is, below.
    json = await res.json().catch((e) => {
      if (res.ok) throw new Error("The hub's answer could not be read. Reload to try again.", { cause: e });
      return {};
    });
  } finally {
    if (timer) clearTimeout(timer);
  }
  // A refusal is an answer too: without this a write the hub turned down read
  // as a success, and the click that asked for it appeared to do nothing.
  if (!res.ok || json.error) throw new Error(json.error || "That could not be saved");
  return json;
}

// A failure closes whatever dialog raised it and is shown under the header,
// so it is still on screen once the dialog is gone.
function showError(e, dialog = modalEl) {
  errorMsg = e?.message || "Something went wrong. Please try again.";
  if (modalEl === dialog) closeModal();
  render();
}
// Runs one action, clearing the last failure first and reporting a new one.
// A second tap on the same thing while the first is still in flight is
// dropped: the page only learns of the first once it has reloaded, so a
// double tap on Redeem filed two requests, each holding points.
const inFlight = new Set();
function attempt(key, action) {
  if (inFlight.has(key)) return Promise.resolve();
  inFlight.add(key);
  errorMsg = "";
  // The dialog on screen when this started. A failure closes that one only:
  // closing whatever is open took a form the adult had since begun typing in.
  const dialog = modalEl;
  const refreshed = outOfDate
    ? loadData().then(() => { outOfDate = false; render(); }, () => { throw new Error("This page is out of date and could not refresh. Reload before trying again."); })
    : Promise.resolve();
  return refreshed.then(action).catch((e) => showError(e, dialog)).finally(() => inFlight.delete(key));
}

async function publishEvent(type, subjectId, payload = {}) {
  await fetch(EVENTS, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ type, subject_id: subjectId, payload }) }).catch(() => {});
}

async function logActivity(type, description, metadata = {}) {
  if (!ACTIVITY) return;
  await fetch(ACTIVITY, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ type, description, metadata }) }).catch(() => {});
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id:"adult-1", name:"Alex", role:"adult" },
      { id:"kid-1", name:"Jordan", role:"child" },
      { id:"kid-2", name:"Casey", role:"child" },
    ];
    return;
  }
  // A member list that could not be read is a failed load, not a household with nobody in it.
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || typeof data !== "object" || data.error || (Array.isArray(data.$errors) && data.$errors.includes("family.members"))) throw new Error("Couldn’t reach the hub. Try again.");
  members = data["family.members"] ?? [];
}

const READ_LIMIT_MS = 20000;
// A read is an answer with rows in it; anything else is not taken for "none".
async function read(sql) {
  const json = await db(sql, [], { timeoutMs: READ_LIMIT_MS });
  if (!Array.isArray(json.rows)) throw new Error("The hub's answer could not be read. Reload to try again.");
  return json;
}

// One load at a time, in the order asked for. Each caller waits for a read
// that started after its own write, which is what lets `attempt` hold a
// member's key until the page really shows that write. Letting a newer load
// cut an older one short released the key over stale balances.
let loadQueue = Promise.resolve();
function loadData() {
  const run = loadQueue.then(readData);
  loadQueue = run.catch(() => {});
  return run;
}

async function readData() {
  if (!DB) {
    if (rewards.length === 0) {
      rewards = [
        { id:"demo-movie", title:"Friday movie choice", description:"Pick the family movie this Friday.", cost_points:25, status:"active", created_at:new Date().toISOString() },
        { id:"demo-game", title:"Extra game time", description:"Redeem for 30 minutes of bonus game time.", cost_points:40, status:"active", created_at:new Date().toISOString() },
      ];
    }
    if (pointsLedger.length === 0) {
      pointsLedger = [
        { event_id:"demo-1", member_id:"kid-1", points:10 },
        { event_id:"demo-2", member_id:"kid-1", points:10 },
        { event_id:"demo-3", member_id:"kid-1", points:5 },
        { event_id:"demo-4", member_id:"kid-2", points:15 },
      ];
    }
    earnedByMember = new Map(members.map(m => [m.id, pointsFromLedger(pointsLedger, m.id)]));
    hydrateRedemptions();
    return;
  }
  // Read into locals and put on the page in one step. Filled in place across
  // these awaits, a tap or a render in between saw every balance as 0, and two
  // loads running together added the rollup twice.
  const nextRewards = ((await read(`SELECT * FROM app_rewards_privileges__rewards ORDER BY created_at`)).rows ?? []).map(normalizeReward);
  if (VIEW_ONLY) {
    // The reward list is the one read the hub answers without a member; the
    // rest are refused, and waiting on them lost the list as well.
    rewards = nextRewards;
    hydrateRedemptions();
    return;
  }
  const nextRequests = (await read(`SELECT * FROM app_rewards_privileges__redemption_requests ORDER BY requested_at DESC`)).rows ?? [];
  const nextDecisions = (await read(`SELECT * FROM app_rewards_privileges__redemption_decisions ORDER BY decided_at DESC`)).rows ?? [];
  // Earned points, aggregated in SQL: the retention rollup's opening balance
  // plus the live ledger tail. The client used to fetch EVERY ledger row and
  // sum in JS — unbounded over years, and it blocked retention outright
  // (expiring rows silently shrank balances). The runner now folds expiring
  // rows into points_rollup transactionally, so this total is stable across
  // expiry, and the wire cost is one row per member forever.
  const nextEarned = new Map();
  const points = (value) => { const n = Number(value ?? 0); return Number.isFinite(n) ? Math.max(0, n) : 0; };
  const tail = (await read(`SELECT member_id, COALESCE(SUM(points), 0) AS earned FROM app_rewards_privileges__points_ledger GROUP BY member_id`)).rows ?? [];
  for (const row of tail) nextEarned.set(row.member_id, points(row.earned));
  const rollup = (await read(`SELECT member_id, points FROM app_rewards_privileges__points_rollup`)).rows ?? [];
  for (const row of rollup) nextEarned.set(row.member_id, (nextEarned.get(row.member_id) ?? 0) + points(row.points));
  rewards = nextRewards;
  redemptionRequests = nextRequests;
  redemptionDecisions = nextDecisions;
  earnedByMember = nextEarned;
  hydrateRedemptions();
}

// The re-read after a write that already landed. Its failure is said as what
// it is: "could not be saved" there sent people to repeat a write that had
// worked.
async function reload() {
  try {
    await loadData();
    outOfDate = false;
  } catch {
    // The write landed and the page does not show it. Every check the next
    // action makes would be against the old balances, so it refreshes first
    // (see attempt).
    outOfDate = true;
    errorMsg = "Saved, but this page could not refresh. Reload to see the latest.";
  }
  render();
}
let outOfDate = false;

function hydrateRedemptions() {
  redemptions = combineRedemptions(rewards, redemptionRequests, redemptionDecisions);
}

function kidList() { return members.filter(m => !isAdult(m)); }
function memberName(id) { return members.find(m => m.id === id)?.name ?? "Someone"; }
function pointsFor(memberId) { return availablePointsFromEarned(earnedByMember, redemptions, memberId); }
// Whose points the page is showing: a child's own, or the child a reviewer
// picked. Nobody, for an adult with no child to look at or no way to read one.
function currentKidId() {
  if (!isAdult(ME)) return ME?.id;
  if (!reviews()) return null;
  const kids = kidList();
  if (!selectedKidId || !kids.some(kid => kid.id === selectedKidId)) selectedKidId = kids[0]?.id ?? null;
  return selectedKidId;
}

async function addReward() {
  if (!isAdult(ME)) return;
  const dialog = modalEl;
  const title = document.getElementById("reward-title").value.trim();
  const description = document.getElementById("reward-description").value.trim();
  const cost = parseInt(document.getElementById("reward-cost").value, 10);
  if (!title || !cost || cost <= 0) {
    // Said in the dialog, which stays open with what was typed.
    const note = document.getElementById("reward-error");
    if (note) {
      note.textContent = !title ? "Give the reward a title." : "Set a cost of at least 1 point.";
      note.hidden = false;
    }
    return;
  }
  const id = crypto.randomUUID();
  if (!DB) {
    rewards = [...rewards, { id, title, description, cost_points:cost, status:"active", created_by:ME.id, created_at:new Date().toISOString() }];
    if (modalEl === dialog) closeModal();
    render();
    return;
  }
  await db(
    `INSERT INTO app_rewards_privileges__rewards (id, title, description, cost_points, status, created_by, created_at)
     VALUES (?, ?, ?, ?, 'active', ?, ?)`,
    [id, title, description, cost, ME.id ?? "adult", new Date().toISOString()]
  );
  await publishEvent("reward.available", id, { reward_id:id, title, cost_points:cost });
  await logActivity("reward_available", `New reward available: ${title}`, { rewardId:id });
  if (modalEl === dialog) closeModal();
  await reload();
}

async function requestReward(rewardId) {
  const reward = rewards.find(r => r.id === rewardId && r.status === "active");
  if (!reward || !ME || isAdult(ME)) return;
  if (!canRedeem(pointsFor(ME.id), reward) || pendingForReward(redemptions, ME.id, rewardId)) return;
  if (!DB) {
    redemptionRequests = [{
      id: crypto.randomUUID(),
      reward_id: rewardId,
      member_id: ME.id,
      requested_at: new Date().toISOString(),
    }, ...redemptionRequests];
    hydrateRedemptions();
    render();
    return;
  }
  await db(
    `INSERT INTO app_rewards_privileges__redemption_requests (id, reward_id, member_id, requested_at)
     VALUES (?, ?, ?, ?)`,
    [crypto.randomUUID(), rewardId, ME.id, new Date().toISOString()]
  );
  await reload();
}

async function decideRedemption(id, status) {
  if (!reviews()) return;
  const redemption = redemptions.find(r => r.id === id);
  const reward = rewards.find(r => r.id === redemption?.reward_id);
  if (!redemption || !reward) return;
  if (!decisionChoices(redemption, canAffordApproval(earnedByMember, redemptions, redemption)).includes(status)) return;
  if (!DB) {
    redemptionDecisions = [
      ...redemptionDecisions.filter(d => d.request_id !== id),
      {
        id: crypto.randomUUID(),
        request_id: id,
        reward_id: reward.id,
        member_id: redemption.member_id,
        status,
        decided_at: new Date().toISOString(),
        decided_by: ME.id,
      },
    ];
    hydrateRedemptions();
    render();
    return;
  }
  try {
    await db(
      `INSERT INTO app_rewards_privileges__redemption_decisions (id, request_id, reward_id, member_id, status, decided_at, decided_by)
       VALUES (?, ?, ?, ?, ?, ?, ?)`,
      [crypto.randomUUID(), id, reward.id, redemption.member_id, status, new Date().toISOString(), ME.id ?? "adult"]
    );
  } catch (e) {
    // A request is answered once. When another reviewer got there first, show
    // their answer instead of a database message over a row that still looks
    // pending and refuses every further tap.
    await loadData().catch(() => {});
    throw /unique/i.test(e?.message ?? "") ? new Error("Someone else already answered this request.") : e;
  }
  if (status === "approved") {
    await publishEvent("reward.redeemed", redemption.member_id, {
      reward_id: reward.id,
      title: reward.title,
      member_id: redemption.member_id,
      member_name: memberName(redemption.member_id),
      cost_points: redemption.cost_points,
    });
    await logActivity("reward_redeemed", `${memberName(redemption.member_id)} redeemed ${reward.title}`, {
      memberId: redemption.member_id,
      rewardId: reward.id,
    });
  }
  await reload();
}

async function archiveReward(id) {
  if (!isAdult(ME)) return;
  if (!DB) {
    rewards = rewards.map(r => r.id === id ? { ...r, status:"archived" } : r);
    hydrateRedemptions();
    render();
    return;
  }
  await db(`UPDATE app_rewards_privileges__rewards SET status = 'archived' WHERE id = ?`, [id]);
  await reload();
}

function openRewardModal() {
  openModal(`
    <h3>Add Reward</h3>
    <div class="form-group"><label>Title</label><input id="reward-title" type="text" placeholder="Friday movie choice" data-autofocus /></div>
    <div class="form-group"><label>Description</label><textarea id="reward-description" rows="3" placeholder="What does the child get?"></textarea></div>
    <div class="form-group"><label>Cost in chore points</label><input id="reward-cost" type="number" min="1" value="25" /></div>
    <p id="reward-error" role="alert" style="color:var(--red);font-size:.84rem" hidden></p>
    <div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="add-reward">Save</button></div>
  `);
}

function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function renderRewardsFor(memberId) {
  const points = memberId ? pointsFor(memberId) : 0;
  const allActive = rewards.filter(reward => reward.status === "active");
  if (allActive.length === 0) return `<div class="empty">No rewards yet. An adult can add the first one.</div>`;
  const activeRewards = searchQ
    ? allActive.filter(r => searchMatch(searchQ, searchableFields(r)))
    : allActive;
  const searchRow = `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search rewards…" aria-label="Search rewards" value="${esc(searchQ)}" /></div>`;
  if (activeRewards.length === 0) return `${searchRow}<div class="empty">No rewards match "${esc(searchQ)}".</div>`;
  return `${searchRow}<div class="grid">${activeRewards.map(reward => {
    const progress = rewardProgress(points, reward);
    const pending = pendingForReward(redemptions, memberId, reward.id);
    const enough = canRedeem(points, reward);
    return `
      <div class="card reward" data-testid="reward-card" data-reward-id="${esc(reward.id)}">
        <div class="reward-top"><h3>${esc(reward.title)}</h3></div>
        <div class="desc">${reward.description ? esc(reward.description) : "No description."}</div>
        ${memberId
          ? `<div class="bar"><div class="fill" style="width:${progress}%"></div></div>
        <div class="meta"><span>${points}/${reward.cost_points} points</span><span>${progress}%</span></div>`
          : `<div class="meta"><span>${reward.cost_points} points</span></div>`}
        ${isAdult(ME)
          ? `<button class="btn btn-ghost btn-sm" data-action="archive-reward" data-reward-id="${esc(reward.id)}">Hide reward</button>`
          : !ME ? ""
          : `<button class="btn btn-primary btn-sm" ${!enough || pending ? "disabled" : ""} data-action="request-reward" data-reward-id="${esc(reward.id)}">${pending ? "Requested" : enough ? "Redeem" : "Keep going"}</button>`}
      </div>`;
  }).join("")}</div>`;
}

function renderRequests() {
  const rows = redemptions.filter(r => reviews() || r.member_id === ME?.id);
  if (rows.length === 0) return `<div class="empty">No redemption requests yet.</div>`;
  return rows.map(r => {
    const reward = rewards.find(x => x.id === r.reward_id) ?? { title:"Hidden reward" };
    const affordable = canAffordApproval(earnedByMember, redemptions, r);
    const choices = reviews() ? decisionChoices(r, affordable) : [];
    // Why Approve is missing, for a reviewer who can still reject.
    const blocked = !choices.length || choices.includes("approved") ? ""
      : !r.reward_available ? "This reward was hidden. Reject to return the points."
      : `${esc(memberName(r.member_id))} does not have enough points for this.`;
    return `
      <div class="card request" data-testid="request-card" data-request-id="${esc(r.id)}">
        <div>
          <div style="font-weight:800">${esc(memberName(r.member_id))} · ${esc(reward.title)}</div>
          <div style="font-size:.8rem;color:var(--muted)">${r.cost_points} points · ${new Date(r.requested_at).toLocaleDateString()}</div>
          ${blocked ? `<div style="font-size:.8rem;color:var(--amber)" data-testid="decision-blocked">${blocked}</div>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="status ${esc(r.status)}">${esc(r.status)}</span>
          ${choices.includes("approved") ? `<button class="btn btn-good btn-sm" data-action="decide-redemption" data-redemption-id="${esc(r.id)}" data-status="approved" data-testid="approve-request">Approve</button>` : ""}
          ${choices.includes("rejected") ? `<button class="btn btn-danger btn-sm" data-action="decide-redemption" data-redemption-id="${esc(r.id)}" data-status="rejected" data-testid="reject-request">Reject</button>` : ""}
        </div>
      </div>`;
  }).join("");
}

function renderKidSelector(activeId) {
  if (!reviews()) return "";
  const kids = kidList();
  if (kids.length <= 1) return "";
  return `<div class="selector">${kids.map(kid => `
    <button class="btn selector-btn ${kid.id === activeId ? "active" : ""}" data-action="select-kid" data-testid="kid-select" data-member-id="${esc(kid.id)}">
      <span>${esc(kid.name)}</span><strong data-testid="kid-select-points">${pointsFor(kid.id)}</strong>
    </button>
  `).join("")}</div>`;
}

function renderDemoSwitcher() {
  if (!LOCAL_DEMO) return "";
  return `<div class="selector">${members.map(member => `
    <button class="btn selector-btn ${member.id === ME?.id ? "active" : ""}" data-action="set-demo-member" data-member-id="${esc(member.id)}">
      <span>${esc(member.name)}</span><span>${isAdult(member) ? "adult" : "kid"}</span>
    </button>
  `).join("")}</div>`;
}

// render() rewrites the whole view, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

function render() {
  if (loadFailed) {
    document.getElementById("root").innerHTML = `
    <header>
      <div><h1>${glyph("gift", { accent: "currentColor" })} Rewards</h1><div class="sub">Visible progress toward things kids care about</div></div>
    </header>
    <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the rewards.</span> <button type="button" class="load-error-retry" data-action="retry-load" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  const memberId = currentKidId();
  const kid = members.find(m => m.id === memberId);
  const points = memberId ? pointsFor(memberId) : 0;
  const pendingCount = redemptions.filter(r => r.status === "pending" && (reviews() || r.member_id === ME?.id)).length;
  // An adult who cannot review has no requests to look at: theirs is the
  // reward list alone.
  const hasRequests = !!ME && (!isAdult(ME) || reviews());
  if (!hasRequests) tab = "rewards";
  const adultNote = VIEW_ONLY ? "You are not a member here, so this is the reward list to look at only."
    : !isAdult(ME) || memberId ? ""
    : hasNoChildren(members) ? "Rewards are earned and redeemed by child members, and there are none here yet. You can set up rewards now; add a child member so someone can earn them."
    : !reviews() ? "In a shared space, the steward sees points and approves requests. Any adult can add rewards."
    : "";
  document.getElementById("root").innerHTML = `
    <header>
      <div><h1>${glyph("gift", { accent: "currentColor" })} Rewards</h1><div class="sub">Visible progress toward things kids care about${LOCAL_DEMO ? " · Demo mode" : ""}</div></div>
      ${isAdult(ME) ? `<button class="btn btn-primary" style="background:#fff;color:var(--accent)" data-action="open-reward-modal" data-testid="add-reward">+ Reward</button>` : ""}
    </header>
    ${errorMsg ? `<div class="card app-error" role="alert"><div class="card-body">${esc(errorMsg)}</div></div>` : ""}
    ${renderDemoSwitcher()}
    ${renderKidSelector(memberId)}
    ${adultNote ? `<div class="card notice" role="status" data-testid="adult-note" data-note="${VIEW_ONLY ? "view-only" : hasNoChildren(members) ? "no-children" : "participant"}"><div class="card-body">${adultNote}</div></div>` : ""}
    ${memberId ? `<div class="points"><div><div class="section-title">${isAdult(ME) ? "Viewing rewards for" : "Working toward"}</div><div style="font-weight:800">${esc(kid?.name ?? "Kid")}</div><div style="font-size:.8rem;color:var(--muted)">${isAdult(ME) ? "Kids redeem points; adults approve requests." : "Redeem when you have enough points. Adults approve requests."}</div></div><strong data-testid="points-balance" data-member-id="${esc(memberId)}">${points}</strong><div style="color:var(--muted);font-weight:700">points</div></div>` : ""}
    ${renderPointsSourceNotice()}
    ${reviews() && pendingCount > 0 && tab !== "requests" ? `<div class="card notice" data-testid="pending-notice"><div class="card-body" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><strong>${pendingCount} pending request${pendingCount === 1 ? "" : "s"}</strong><button class="btn btn-primary btn-sm" data-action="set-tab" data-tab="requests">Review</button></div></div>` : ""}
    ${hasRequests ? `<div class="tabs" data-testid="tabs">
      <button class="tab ${tab === "rewards" ? "active" : ""}" data-action="set-tab" data-tab="rewards" data-testid="tab">Rewards</button>
      <button class="tab ${tab === "requests" ? "active" : ""}" data-action="set-tab" data-tab="requests" data-testid="tab">Requests${pendingCount ? ` (${pendingCount})` : ""}</button>
    </div>` : ""}
    ${tab === "rewards" ? renderRewardsFor(memberId) : renderRequests()}
  `;
}

function renderPointsSourceNotice() {
  if (!pointsSource) return "";
  const settings = HUB_ORIGIN
    ? ` <a href="${esc(HUB_ORIGIN)}/settings/automations" target="_top">Settings → Automations</a>`
    : " Settings → Automations";
  const text = pointsSource.state === "unavailable"
    ? `Points come from other apps, such as completed chores. Install ${esc(pointsSource.publishers.join(" or ") || "a chores app")} to start earning.`
    : `Points are not being counted: "${esc(pointsSource.title)}" is off. Turn it on in${settings}.${pointsSource.publishers.length ? ` Points can also come from ${esc(pointsSource.publishers.join(" or "))}, once installed.` : ""}`;
  return `<div class="card notice" role="status"><div class="card-body">${text}</div></div>`;
}

window.openRewardModal = openRewardModal;
window.addReward = addReward;
window.requestReward = requestReward;
window.decideRedemption = decideRedemption;
window.archiveReward = archiveReward;
window.closeModal = closeModal;
window.setTab = next => { tab = next; render(); };
window.selectKid = id => { selectedKidId = id; render(); };
window.setDemoMember = id => {
  if (!LOCAL_DEMO) return;
  const member = members.find(m => m.id === id);
  if (!member) return;
  ME = member;
  if (!isAdult(ME)) selectedKidId = ME.id;
  render();
};

document.addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const { action, rewardId, redemptionId, status, memberId, tab: nextTab } = button.dataset;
  if (action === "retry-load") firstLoad();
  if (action === "open-reward-modal") openRewardModal();
  if (action === "add-reward") attempt("add-reward", () => addReward());
  if (action === "close-modal") closeModal();
  if (action === "archive-reward" && rewardId) attempt(`archive:${rewardId}`, () => archiveReward(rewardId));
  // Keyed by the MEMBER whose points are in play, not by the reward or the
  // request: every check is against that member's balance as last loaded, and
  // the key is held until the reload, so the next answer sees this one.
  if (action === "request-reward" && rewardId) attempt(`points:${ME?.id}`, () => requestReward(rewardId));
  if (action === "decide-redemption" && redemptionId && status) {
    const owner = redemptions.find(r => r.id === redemptionId)?.member_id ?? redemptionId;
    attempt(`points:${owner}`, () => decideRedemption(redemptionId, status));
  }
  if (action === "select-kid" && memberId) window.selectKid(memberId);
  if (action === "set-demo-member" && memberId) window.setDemoMember(memberId);
  if (action === "set-tab" && nextTab) window.setTab(nextTab);
});

async function firstLoad() {
  loadFailed = false;
  await loadMembers().then(() => loadData()).catch(() => { loadFailed = true; });
  render();
  if (!LOCAL_DEMO && window.__IS_ADMIN) {
    pointsSource = stalledPointsSource(await automationStatus().catch(() => null));
    if (pointsSource) render();
  }
}
firstLoad();
</script>
</body>
</html>
